<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a8c2f2">
  <meta name="description" content="Headlyn is a concise, source-linked daily news briefing.">
  <title>Headlyn — The stories worth knowing.</title>
  <link rel="icon" type="image/png" href="assets/images/HEADLYN-BLUE-LOGO.png">
  <style>
    :root {
      --blue: #173fe6;
      --blue-deep: #102dba;
      --ink: #111827;
      --muted: #52627b;
      --sky-top: #789be7;
      --sky-bottom: #c9dcfb;
      --white: #fffefa;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      --serif: "Iowan Old Style", Baskerville, Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: #f4f7fc;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      position: relative;
      width: calc(100% - 48px);
      height: calc(100vh - 48px);
      min-height: 0;
      margin: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 28px clamp(22px, 6vw, 92px) 0;
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 32px;
      box-shadow: 0 18px 50px rgba(42, 76, 130, .08);
      background:
        radial-gradient(ellipse at 50% 66%, rgba(255, 255, 255, .58) 0%, rgba(255, 255, 255, .2) 23%, transparent 57%),
        radial-gradient(ellipse at 12% 14%, rgba(255, 255, 255, .28), transparent 28%),
        radial-gradient(ellipse at 88% 30%, rgba(255, 255, 255, .18), transparent 27%),
        radial-gradient(circle at 92% 78%, rgba(62, 104, 209, .24), transparent 35%),
        linear-gradient(145deg, var(--sky-top) 0%, #9ebbf0 43%, var(--sky-bottom) 100%);
    }

    .hero::before {
      position: absolute;
      right: 6%;
      bottom: -24%;
      left: 6%;
      height: 55%;
      border-radius: 50%;
      background: rgba(255, 255, 255, .34);
      content: "";
      filter: blur(58px);
      pointer-events: none;
    }

    .hero::after {
      position: absolute;
      top: 18%;
      left: 50%;
      width: min(60vw, 760px);
      height: min(60vw, 760px);
      border: 0;
      border-radius: 50%;
      box-shadow: none;
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    .nav,
    .hero-content,
    .phones {
      position: relative;
      z-index: 1;
      width: min(100%, 1180px);
      margin-right: auto;
      margin-left: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 46px;
    }

    .creator-links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.5vw, 34px);
      order: 2;
    }

    .creator-links a,
    .brand {
      color: var(--ink);
      text-decoration: none;
    }

    .creator-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #111827;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.01em;
      opacity: 1;
      transition: opacity .2s;
    }

    .creator-links a:hover { opacity: 1; }

    .creator-icon {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .creator-icon.github {
      fill: currentColor;
      stroke: none;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: clamp(8px, .85vw, 12px);
      height: clamp(36px, 3.2vw, 46px);
      order: 1;
    }

    .brand img {
      display: block;
      width: clamp(36px, 3.2vw, 46px);
      height: clamp(36px, 3.2vw, 46px);
      border-radius: 14px;
    }

    .brand-name {
      display: block;
      font-size: clamp(20px, 1.7vw, 24px);
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1;
    }

    .brand-subtitle {
      display: block;
      margin-top: 5px;
      color: rgba(17, 24, 39, .57);
      font-size: clamp(7px, .65vw, 9px);
      font-weight: 700;
      letter-spacing: .2em;
      line-height: 1;
      text-transform: uppercase;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
      padding-top: clamp(28px, 4vh, 48px);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 0 24px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--blue);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .2em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      width: clamp(28px, 6vw, 72px);
      height: 1px;
      background: rgba(23, 63, 230, .35);
      content: "";
    }

    h1 {
      max-width: 860px;
      margin: 0;
      color: #121a2b;
      font-family: var(--serif);
      font-size: clamp(48px, 5.4vw, 78px);
      font-weight: 600;
      letter-spacing: -.06em;
      line-height: .95;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 780px;
      margin: 26px 0 0;
      color: rgba(17, 24, 39, .7);
      font-size: clamp(17px, 1.55vw, 22px);
      line-height: 1.45;
      text-wrap: balance;
    }

    .enroll-form {
      display: flex;
      width: min(100%, 540px);
      margin-top: 30px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, .74);
      border-radius: 999px;
      background: rgba(255, 255, 255, .68);
      box-shadow: 0 8px 22px rgba(60, 90, 140, .08);
    }

    .enroll-form input {
      min-width: 0;
      flex: 1;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      outline: 0;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      background: transparent;
    }

    .enroll-form input::placeholder { color: #75849b; }

    .enroll-form input:focus { box-shadow: inset 0 0 0 2px rgba(23, 63, 230, .15); }

    .enroll-form button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 17px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      background: var(--blue);
      transition: background .2s;
    }

    .enroll-icon {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .enroll-form button:hover { background: var(--blue-deep); }

    .enroll-note {
      min-height: 20px;
      margin: 9px 0 0;
      color: rgba(17, 24, 39, .5);
      font-size: 12px;
      line-height: 1.5;
    }

    .phones {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex: 1 1 auto;
      min-height: 0;
      width: min(100%, 560px);
      height: auto;
      margin-top: clamp(18px, 3vh, 32px);
      overflow: hidden;
    }

    .phone-crop {
      position: relative;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .phone-crop img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 16px 14px rgba(52, 82, 130, .08));
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Two phones work on wide screens; a single centered preview is clearer
       on iPad and mobile widths. */
    @media (max-width: 1200px) {
      .hero-content { padding-top: clamp(28px, 4vh, 48px); }
      h1 { font-size: clamp(46px, 6vw, 72px); }
      .phones { width: min(100%, 460px); }
    }

    @media (max-width: 720px) {
      .hero {
        width: calc(100% - 20px);
        height: calc(100vh - 20px);
        min-height: 0;
        margin: 10px;
        padding: 22px 18px 0;
        border-radius: 24px;
      }
      .nav { align-items: center; }
      .creator-links { gap: 15px; }
      .creator-links a { font-size: 11px; }
      .creator-links a:not(:nth-child(2)) { display: none; }
      .brand { gap: 8px; }
      .brand { height: 38px; }
      .brand img { width: 38px; height: 38px; border-radius: 11px; }
      .brand-name { font-size: 20px; font-weight: 650; }
      .brand-subtitle { font-size: 7px; letter-spacing: .16em; }
      .hero-content { padding-top: 32px; }
      .eyebrow { gap: 10px; margin-bottom: 18px; font-size: 10px; }
      h1 { font-size: clamp(44px, 13vw, 64px); line-height: .94; }
      .subtitle { margin-top: 21px; font-size: 16px; }
      .enroll-form { display: flex; padding: 4px; border-radius: 999px; }
      .enroll-form input {
        width: auto;
        min-height: 42px;
        padding: 0 12px;
        font-size: 11px;
      }
      .enroll-form button {
        width: auto;
        flex: 0 0 auto;
        min-height: 42px;
        margin-top: 0;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 11px;
      }
      .enroll-note { font-size: 11px; }
      .phones {
        flex: 1 1 auto;
        min-height: 0;
        width: min(100%, 340px);
        margin-top: 20px;
        overflow: hidden;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" id="subscribe" aria-labelledby="hero-title">
      <nav class="nav" aria-label="Creator links">
        <a class="brand" href="#subscribe" aria-label="Headlyn home">
        <img src="assets/images/HEADLYN-BLUE-LOGO.png" alt="Headlyn logo">
        <span>
          <span class="brand-name">Headlyn</span>
          <span class="brand-subtitle">The Newsletter</span>
        </span>
        </a>
        <div class="creator-links">
          <!-- Replace the two profile URLs with the creator's verified accounts. -->
          <a href="https://github.com/" target="_blank" rel="noreferrer">
            <svg class="creator-icon github" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 .7a11.3 11.3 0 0 0-3.6 22c.57.1.78-.25.78-.55v-2.1c-3.18.7-3.85-1.34-3.85-1.34-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.72-1.54-2.54-.29-5.2-1.27-5.2-5.65 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.02 0 0 .97-.31 3.12 1.17a10.8 10.8 0 0 1 5.68 0c2.15-1.48 3.12-1.17 3.12-1.17.62 1.57.23 2.73.11 3.02.73.8 1.18 1.82 1.18 3.07 0 4.39-2.67 5.35-5.21 5.64.41.36.77 1.07.77 2.16v3.2c0 .3.2.66.79.55A11.3 11.3 0 0 0 12 .7Z"></path>
            </svg>
            GitHub
          </a>
          <a href="https://www.linkedin.com/" target="_blank" rel="noreferrer">
            <svg class="creator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6Z"></path>
              <path d="M2 9h4v12H2z"></path>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            LinkedIn
          </a>
          <a href="mailto:vishnurchityala@gmail.com">
            <svg class="creator-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
            Gmail
          </a>
        </div>
      </nav>

      <div class="hero-content">
        <p class="eyebrow">The Daily Newsletter</p>
        <h1 id="hero-title">The Stories<br>Worth Knowing.</h1>
        <p class="subtitle">A concise, source-linked daily briefing that helps you understand the stories shaping India and the world, without the noise.</p>

        <form class="enroll-form" id="enroll-form" novalidate>
          <label class="visually-hidden" for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required>
          <button type="submit">
            Enroll for free
            <svg class="enroll-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
          </button>
        </form>
        <p class="enroll-note" id="enroll-note" aria-live="polite">No account or password required.</p>
      </div>

      <div class="phones" aria-label="Headlyn newsletter preview">
        <div class="phone-crop">
          <img src="assets/images/PHONE-MOCK-IMAGE.png" alt="Headlyn newsletter shown on two iPhones">
        </div>
      </div>
    </section>
  </main>

  <script>
    const enrollForm = document.querySelector('#enroll-form');
    const emailInput = document.querySelector('#email');
    const enrollNote = document.querySelector('#enroll-note');

    enrollForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!emailInput.validity.valid || !emailInput.value.trim()) {
        enrollNote.textContent = 'Enter a valid email address to continue.';
        enrollNote.style.color = '#a12b3d';
        emailInput.focus();
        return;
      }

      const submitButton = enrollForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      enrollNote.textContent = 'Submitting your registration…';
      enrollNote.style.color = 'rgba(17, 24, 39, .5)';

      fetch('https://headlyn-backend-eta.vercel.app/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput.value })
      })
        .then(async (response) => {
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || 'Unable to register right now.');
          }
          return payload;
        })
        .then((payload) => {
          enrollNote.textContent = payload.message || 'Registration received. Access is pending approval.';
          enrollNote.style.color = '#173fe6';
          emailInput.value = '';
        })
        .catch((error) => {
          enrollNote.textContent = error.message;
          enrollNote.style.color = '#a12b3d';
        })
        .finally(() => {
          submitButton.disabled = false;
        });
    });
  </script>
</body>
</html>
